<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <title>Noto — Enregistrements de cours</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="Noto, accueil">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 4.75h9.5A2.5 2.5 0 0 1 18 7.25V19.5H8.5A2.5 2.5 0 0 1 6 17V4.75Z" stroke="currentColor" stroke-width="1.8"/><path d="M6 17V6.5A2.5 2.5 0 0 1 8.5 4H18M9.5 9h5M9.5 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span>Noto</span>
        </a>
        <button id="headerAddCourseBtn" class="icon-button" type="button" aria-label="Ajouter un cours" title="Ajouter un cours">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>

      <main class="main-content">
        <section class="view" data-view="home">
          <div class="page-heading">
            <div>
              <p class="overline">Bibliothèque</p>
              <h1>Mes cours</h1>
            </div>
            <span id="courseCount" class="muted-count">0 cours</span>
          </div>
          <div id="courseGrid" class="course-grid" aria-live="polite"></div>
        </section>

        <section class="view is-hidden" data-view="course">
          <div class="page-heading course-heading">
            <div class="heading-with-back">
              <button id="backToCoursesBtn" class="icon-button subtle" type="button" aria-label="Retour aux cours">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div>
                <p class="overline">Cours</p>
                <h1 id="courseTitle">Cours</h1>
              </div>
            </div>
            <div class="heading-actions">
              <button id="renameCourseBtn" class="icon-button subtle" type="button" aria-label="Renommer le cours" title="Renommer">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6 4 4M5 19l3.5-.7L18.5 8.3a2.12 2.12 0 0 0-3-3L5.5 15.3 5 19Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button id="deleteCourseBtn" class="icon-button subtle danger" type="button" aria-label="Supprimer le cours" title="Supprimer">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M10 11v5M14 11v5M8 7l.7-2h6.6l.7 2m-10 0 .7 13h10.6l.7-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>

          <section class="recording-panel">
            <div class="recording-panel-header">
              <div>
                <p class="overline">Nouveau</p>
                <h2>Enregistrer le cours</h2>
              </div>
              <span id="recordingStatus" class="status">Prêt</span>
            </div>
            <div class="recording-controls">
              <button id="recordBtn" class="record-button" type="button" aria-label="Démarrer l'enregistrement">
                <span class="record-dot"></span>
                <span id="recordButtonLabel">Démarrer</span>
              </button>
              <button id="uploadBtn" class="secondary-button" type="button">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Importer un fichier
              </button>
              <input id="audioFileInput" class="visually-hidden" type="file" accept="audio/*" />
            </div>
            <p class="helper-text">Sauvegarde automatique activée. Les fichiers restent dans ce navigateur.</p>
          </section>

          <section>
            <div class="section-heading">
              <h2>Enregistrements</h2>
              <span id="recordingCount" class="muted-count">0</span>
            </div>
            <div id="recordingList" class="recording-list" aria-live="polite"></div>
          </section>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Navigation principale">
        <button class="nav-item is-active" data-target-view="home" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 20v-6h6v6" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Cours</span>
        </button>
        <button id="navAddCourseBtn" class="nav-add" type="button" aria-label="Ajouter un cours">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="nav-item" data-target-view="course" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13ZM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13Z" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Actuel</span>
        </button>
      </nav>
    </div>

    <div id="courseModal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modalTitle">Nouveau cours</h2>
          <button id="closeModalBtn" class="icon-button subtle" type="button" aria-label="Fermer">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <form id="courseForm">
          <label class="field">
            <span id="modalFieldLabel">Nom du cours</span>
            <input id="courseNameInput" type="text" maxlength="60" placeholder="Ex. Histoire" required />
          </label>
          <button class="primary-button full-width" type="submit">Enregistrer</button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
